name: Project checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check project context
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: npm run context -- check "$BASE_SHA"
      - run: npm run test:package
      - if: runner.os == 'Linux'
        run: npm run build:site
